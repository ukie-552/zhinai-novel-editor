<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>织奈编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 顶栏 (toolbar) -->
    <header class="app-header">
      <div class="brand">
        <img src="img/AppIcon.png" alt="" />
        <span>织奈编辑器</span>
      </div>
      <div class="toolbar" style="margin-left:12px">
        <div class="tb-menu" data-menu="book">
          <button class="tb-btn" data-trigger="book">
            <span class="icon">📚</span>
            <span data-bind="currentBookTitle">选择作品</span>
            <span style="opacity:.5;font-size:10px">▾</span>
          </button>
          <div class="menu-popup" id="menu-book">
            <div class="menu-item" data-act="select-none">— 不选作品 —</div>
            <div class="menu-item" data-act="new">＋ 新建作品</div>
            <div class="menu-item" data-act="import">导入作品…</div>
            <div class="menu-item" data-act="export">导出当前作品</div>
            <div class="menu-item" data-act="delete" style="color:#b91c1c">删除当前作品</div>
          </div>
        </div>
        <button class="tb-btn" id="newChapterBtn" data-tooltip="新建章节 (⌘N)">
          <span class="icon">＋</span>章节
        </button>
        <button class="tb-btn" id="newConvBtn" data-tooltip="新建对话 (⌘⇧N)">
          <span class="icon">💬</span>对话
        </button>
        <div class="tb-menu" data-menu="ai">
          <button class="tb-btn" data-trigger="ai" id="aiMenuBtn">
            <span class="icon">✨</span>写作工具 <span style="opacity:.5;font-size:10px">▾</span>
          </button>
          <div class="menu-popup" id="menu-ai" style="min-width:240px">
            <!-- 启动时由 app.js 从 /api/skills/catalog 拉取并按分类填充 -->
          </div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="toolbar">
        <button class="btn-icon" id="agentBtn" data-tooltip="Agent 管理">🤖</button>
        <button class="btn-icon" id="settingsBtn" data-tooltip="设置">⚙</button>
      </div>
    </header>

    <!-- 主体 -->
    <div class="app-body">
      <!-- 活动栏 -->
      <nav class="activity-bar" id="activityBar">
        <button class="ab-btn" data-tab="books" data-tooltip="作品">📚</button>
        <button class="ab-btn" data-tab="chapters" data-tooltip="章节">📄</button>
        <button class="ab-btn" data-tab="lore" data-tooltip="设定库">📖</button>
        <button class="ab-btn" data-tab="search" data-tooltip="搜索">🔍</button>
        <button class="ab-btn" data-tab="chat" data-tooltip="对话">💬</button>
        <button class="ab-btn" data-tab="agents" data-tooltip="Agent">🤖</button>
        <button class="ab-btn" data-tab="vectors" data-tooltip="向量库">▦</button>
        <button class="ab-btn" data-tab="skills" data-tooltip="技能">🧩</button>
        <div class="spacer"></div>
        <button class="btn-icon" id="bgOpacityBtn" data-tooltip="背景透明度">🌫</button>
      </nav>

      <!-- 侧栏 -->
      <aside class="sidebar" id="sidebarPane">
        <div class="side-header" id="sideTitle">侧栏</div>
        <div class="side-body" id="sidebar"></div>
      </aside>
      <!-- 拖动分隔条 (侧栏右) -->
      <div class="resize-divider" id="sidebarDivider" data-tooltip="拖动调整宽度"></div>

      <!-- 主区 -->
      <main class="main-area">
        <div class="main-body" id="main"></div>
      </main>
    </div>
  </div>

  <!-- 视图模板 -->
  <template id="tpl-books">
    <div class="main-title">作品</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn-primary" id="newBook">＋ 新建作品</button>
      <button class="btn-secondary" id="importBookBtn">导入…</button>
    </div>
    <div id="bookList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px"></div>
  </template>

  <template id="tpl-chapters">
    <div class="editor-shell">
      <div class="editor-head">
        <input class="title" id="chapterTitle" placeholder="章节标题" />
        <button class="btn-secondary" id="aiContinueBtn" data-tooltip="续写">✨ 续写</button>
        <button class="btn-secondary" id="aiPolishBtn" data-tooltip="润色">🪄 润色</button>
        <button class="btn-secondary" id="saveChapterBtn">保存</button>
      </div>
      <textarea id="editor" placeholder="开始写吧…"></textarea>
      <div class="lore-hint" id="loreHint"></div>
      <div class="editor-foot">
        <span class="dot" id="saveDot"></span>
        <span id="saveText">未保存</span>
        <span class="hint" id="wordCount">0 字</span>
      </div>
    </div>
  </template>

  <template id="tpl-lore">
    <div class="main-title">设定库</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100% - 50px)">
      <div>
        <label class="field"><span>分类</span>
          <select id="loreKind">
            <option value="character">人物</option>
            <option value="location">地点</option>
            <option value="world">世界观</option>
            <option value="item">物品</option>
            <option value="other">其他</option>
          </select>
        </label>
        <div id="loreList"></div>
      </div>
      <div>
        <label class="field"><span>名称</span><input id="loreName" placeholder="名称" /></label>
        <label class="field"><span>触发关键词 (逗号分隔)</span><input id="loreKeywords" placeholder="例如: 凌霄, 风火轮, 青云宗" /></label>
        <label class="field" style="height:calc(100% - 200px);display:flex;flex-direction:column">
          <span>设定内容</span>
          <textarea id="loreContent" style="flex:1;min-height:0;font:14px/1.7 ui-serif,'Songti SC',serif" placeholder="设定内容…"></textarea>
        </label>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn-link danger" id="deleteLoreBtn">删除</button>
          <button class="btn-primary" id="saveLoreBtn">保存</button>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-chat">
    <div class="main-title">对话</div>
    <div style="display:grid;grid-template-columns:1fr;gap:8px">
      <div style="display:flex;gap:8px;align-items:center">
        <label style="flex:1;display:flex;align-items:center;gap:8px">
          <span style="font-size:12px;color:var(--text-soft)">Agent:</span>
          <select id="chatAgentSel" style="flex:1;max-width:240px"></select>
        </label>
        <button class="btn-secondary" id="newChatBtn">＋ 新对话</button>
      </div>
      <div id="chatMessages" style="background:rgba(255,255,255,0.55);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:60vh;display:flex;flex-direction:column;gap:8px;overflow:auto"></div>
      <div style="display:flex;gap:8px;align-items:flex-end">
        <textarea id="chatInput" rows="2" placeholder="说点什么… (Ctrl+Enter 发送)" style="flex:1"></textarea>
        <button class="btn-primary" id="chatSendBtn">发送</button>
      </div>
    </div>
  </template>

  <template id="tpl-agents">
    <div class="main-title">Agent</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn-primary" id="newAgentBtn">＋ 新建 Agent</button>
    </div>
    <div id="agentList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px"></div>
  </template>

  <template id="tpl-search">
    <div class="main-title">搜索</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input id="searchInput" placeholder="搜作品名/章节正文/设定/关键词 (Ctrl+K 聚焦)" style="flex:1" autofocus />
      <button class="btn-primary" id="searchBtn">搜索</button>
    </div>
    <div id="searchResults"></div>
  </template>

  <template id="tpl-vectors">
    <div class="main-title">本地向量库</div>
    <div class="sheet">
      <div id="vecStats" style="font-size:12.5px;color:var(--text-soft);margin-bottom:12px">…</div>
      <label class="field"><span>来源</span><input id="vecSource" placeholder="例如: book-1-chapter-3" /></label>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="btn-secondary" id="vecImportBtn">导入当前章节</button>
      </div>
      <label class="field"><span>查询</span>
        <div style="display:flex;gap:6px"><input id="vecQuery" placeholder="搜索关键字" /><button class="btn-primary" id="vecSearchBtn">搜索</button></div>
      </label>
      <div id="vecHits" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
  </template>

  <template id="tpl-skills">
    <div class="main-title">技能</div>
    <div style="font-size:12px;color:var(--text-soft);margin-bottom:12px">技能位于 <code>%APPDATA%\ZhinaiNovelEditor\skills\&lt;name&gt;\SKILL.md</code>, 由 Agent 按需读取。</div>
    <div id="skillList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px"></div>
  </template>

  <template id="tpl-settings">
    <div class="main-title">设置</div>
    <div class="sheet" style="max-width:780px">
      <h3 class="section-title">模型连接</h3>
      <label class="field"><span>模型商</span>
        <select id="cfgProvider"></select>
      </label>
      <label class="field"><span>Base URL</span><input id="cfgBaseURL" placeholder="https://api.openai.com/v1" /></label>
      <label class="field"><span>API Key (仅保存在本机)</span>
        <div style="display:flex;gap:6px">
          <input type="password" id="cfgApiKey" style="flex:1" />
          <button class="btn-secondary" id="cfgKeyToggle" type="button">显示</button>
        </div>
      </label>
      <label class="field"><span>模型</span>
        <div style="display:flex;gap:6px">
          <input id="cfgModel" placeholder="gpt-4o-mini" style="flex:1" list="cfgModelList" />
          <datalist id="cfgModelList"></datalist>
        </div>
      </label>
      <label class="field"><span>温度 (<span id="cfgTempVal">0.70</span>)</span>
        <input type="range" id="cfgTemp" min="0" max="1.5" step="0.05" />
      </label>
      <label class="field"><span>输出上限 (token)</span>
        <input type="number" id="cfgMaxTokens" min="256" step="1024" />
      </label>
      <label class="field"><span>输入窗口 (token, 用于预算告警)</span>
        <input type="number" id="cfgContextWindow" min="1024" step="1024" />
      </label>
      <label class="field" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="cfgEnableTools" style="width:auto" />
        <span>写作工具 (Tool Use) — 让模型可调用搜索/读取/列出等只读工具</span>
      </label>
      <label class="field" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="cfgEnableComp" style="width:auto" />
        <span>上下文自动压缩 (达输入窗口 80% 时触发)</span>
      </label>
      <label class="field" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="cfgFollowStream" style="width:auto" />
        <span>输出跟随 (自动滚动到最新)</span>
      </label>

      <h3 class="section-title">外观</h3>
      <label class="field"><span>背景</span>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="file" id="bgFile" accept="image/*,video/mp4,video/webm" style="display:none" />
          <button class="btn-secondary" id="bgPickBtn">📁 选择图片或视频</button>
          <button class="btn-link" id="bgResetBtn" style="margin-left:auto">恢复默认</button>
        </div>
        <div id="bgPreview" style="margin-top:8px;width:200px;height:80px;background:rgba(0,0,0,0.05);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text-faint);font-size:11.5px">默认</div>
      </label>
      <label class="field"><span>背景可见度 (<span id="bgOpacityVal">64</span>%)</span>
        <input type="range" id="bgOpacity" min="10" max="90" step="5" />
      </label>

      <h3 class="section-title">数据</h3>
      <div style="font-size:12px;color:var(--text-soft);margin-bottom:8px;padding:8px 10px;background:rgba(0,0,0,0.04);border-radius:6px">
        所有数据保存在本机: <code id="cfgDataDir">%APPDATA%\ZhinaiNovelEditor\</code>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-secondary" id="cfgOpenDir">打开数据目录</button>
        <button class="btn-secondary" id="cfgTestBtn">测试连接</button>
        <button class="btn-primary" id="cfgSaveBtn">保存</button>
        <span id="cfgTestResult" style="font-size:12px;color:var(--text-soft);margin-left:auto"></span>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
