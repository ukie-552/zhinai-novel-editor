<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>织奈编辑器</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="bg-stone-50 text-stone-900 select-none">
  <div id="app" class="h-screen flex flex-col">
    <!-- Header -->
    <header class="h-12 flex items-center px-4 border-b border-stone-200 bg-white/80 backdrop-blur">
      <div class="font-semibold text-stone-800">织奈编辑器</div>
      <div class="ml-3 text-xs text-stone-400" id="health">检查中…</div>
      <div class="flex-1"></div>
      <button class="btn-secondary" data-view="settings">设置</button>
    </header>

    <div class="flex-1 flex overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-60 border-r border-stone-200 bg-white flex flex-col">
        <div class="p-3 text-xs uppercase tracking-wider text-stone-400">视图</div>
        <nav id="nav" class="px-2 space-y-1">
          <button data-view="books" class="nav-item nav-active">作品</button>
          <button data-view="chapters" class="nav-item">章节</button>
          <button data-view="lore" class="nav-item">设定库</button>
          <button data-view="chat" class="nav-item">对话</button>
          <button data-view="agents" class="nav-item">Agent</button>
          <button data-view="vectors" class="nav-item">向量库</button>
          <button data-view="skills" class="nav-item">技能</button>
        </nav>
        <div class="flex-1"></div>
        <div class="p-3 text-xs text-stone-400 border-t border-stone-200">
          <div>数据：<code id="dataPath" class="text-stone-500">…</code></div>
          <button class="btn-link mt-1" id="openDataDir">打开数据目录</button>
        </div>
      </aside>

      <!-- Main -->
      <main id="main" class="flex-1 overflow-auto p-6"></main>
    </div>
  </div>

  <!-- 模板 -->
  <template id="tpl-books">
    <div class="space-y-4">
      <div class="flex items-center gap-3">
        <h2 class="text-xl font-semibold">作品</h2>
        <button class="btn-primary" id="newBook">新建作品</button>
      </div>
      <div id="bookList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
    </div>
  </template>

  <template id="tpl-chapters">
    <div class="grid grid-cols-12 gap-4 h-full">
      <div class="col-span-3 border border-stone-200 rounded-lg bg-white overflow-hidden flex flex-col">
        <div class="p-3 border-b border-stone-200 flex items-center gap-2">
          <select id="bookSelect" class="flex-1 bg-stone-50 border border-stone-200 rounded px-2 py-1 text-sm"></select>
          <button class="btn-primary-sm" id="newChapter">+</button>
        </div>
        <div id="chapterList" class="flex-1 overflow-auto"></div>
      </div>
      <div class="col-span-9 flex flex-col gap-3">
        <div class="flex items-center gap-2">
          <input id="chapterTitle" class="flex-1 px-3 py-2 border border-stone-200 rounded text-lg font-semibold" placeholder="章节标题" />
          <button class="btn-secondary" id="aiContinue">AI 续写</button>
          <button class="btn-primary" id="saveChapter">保存</button>
        </div>
        <textarea id="editor" class="flex-1 min-h-[60vh] p-4 border border-stone-200 rounded font-serif text-base leading-7 focus:outline-none focus:border-stone-400" placeholder="开始写吧…"></textarea>
        <div id="loreHint" class="text-xs text-stone-500"></div>
      </div>
    </div>
  </template>

  <template id="tpl-lore">
    <div class="grid grid-cols-12 gap-4 h-full">
      <div class="col-span-4 border border-stone-200 rounded-lg bg-white overflow-hidden flex flex-col">
        <div class="p-3 border-b border-stone-200 flex items-center gap-2">
          <select id="loreKind" class="bg-stone-50 border border-stone-200 rounded px-2 py-1 text-sm">
            <option value="character">人物</option>
            <option value="location">地点</option>
            <option value="world">世界观</option>
            <option value="item">物品</option>
            <option value="other">其他</option>
          </select>
          <button class="btn-primary-sm ml-auto" id="newLore">+</button>
        </div>
        <div id="loreList" class="flex-1 overflow-auto"></div>
      </div>
      <div class="col-span-8 flex flex-col gap-3">
        <input id="loreName" class="px-3 py-2 border border-stone-200 rounded text-lg font-semibold" placeholder="名称" />
        <input id="loreKeywords" class="px-3 py-2 border border-stone-200 rounded text-sm" placeholder="触发关键词, 用逗号分隔" />
        <textarea id="loreContent" class="flex-1 min-h-[50vh] p-3 border border-stone-200 rounded font-serif leading-7 focus:outline-none focus:border-stone-400" placeholder="设定内容…"></textarea>
        <div class="flex justify-end gap-2">
          <button class="btn-secondary" id="deleteLore">删除</button>
          <button class="btn-primary" id="saveLore">保存</button>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-chat">
    <div class="grid grid-cols-12 gap-4 h-full">
      <div class="col-span-3 border border-stone-200 rounded-lg bg-white flex flex-col overflow-hidden">
        <div class="p-3 border-b border-stone-200 flex items-center gap-2">
          <select id="agentSelect" class="flex-1 bg-stone-50 border border-stone-200 rounded px-2 py-1 text-sm"></select>
          <button class="btn-primary-sm" id="newConv">+</button>
        </div>
        <div id="convList" class="flex-1 overflow-auto"></div>
      </div>
      <div class="col-span-9 flex flex-col border border-stone-200 rounded-lg bg-white overflow-hidden">
        <div id="messages" class="flex-1 overflow-auto p-4 space-y-3"></div>
        <div class="border-t border-stone-200 p-3 flex gap-2">
          <textarea id="chatInput" rows="2" class="flex-1 px-3 py-2 border border-stone-200 rounded resize-none focus:outline-none focus:border-stone-400" placeholder="说点什么… (Ctrl+Enter 发送)"></textarea>
          <button class="btn-primary" id="sendChat">发送</button>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-agents">
    <div class="space-y-4">
      <div class="flex items-center gap-3">
        <h2 class="text-xl font-semibold">Agent</h2>
        <button class="btn-primary" id="newAgent">新建</button>
      </div>
      <div id="agentList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </div>
  </template>

  <template id="tpl-vectors">
    <div class="space-y-4">
      <h2 class="text-xl font-semibold">本地向量库</h2>
      <div class="bg-white border border-stone-200 rounded-lg p-4 space-y-3">
        <div class="text-sm text-stone-600" id="vecStats">…</div>
        <div class="flex gap-2">
          <input id="vecSource" class="px-3 py-2 border border-stone-200 rounded text-sm flex-1" placeholder="来源名 (例如 book-1-chapter-3)" />
          <button class="btn-secondary" id="vecImport">导入当前章节</button>
        </div>
        <div class="flex gap-2">
          <input id="vecQuery" class="px-3 py-2 border border-stone-200 rounded text-sm flex-1" placeholder="搜索关键字" />
          <button class="btn-primary" id="vecSearch">搜索</button>
        </div>
        <div id="vecHits" class="space-y-2"></div>
      </div>
    </div>
  </template>

  <template id="tpl-skills">
    <div class="space-y-4">
      <h2 class="text-xl font-semibold">本地技能 (Markdown)</h2>
      <div class="text-xs text-stone-500">技能位于 <code>%APPDATA%/ZhinaiNovelEditor/skills/&lt;name&gt;/SKILL.md</code>，由 Agent 按需读取。</div>
      <div id="skillList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </div>
  </template>

  <template id="tpl-settings">
    <div class="space-y-4 max-w-2xl">
      <h2 class="text-xl font-semibold">设置</h2>
      <div class="bg-white border border-stone-200 rounded-lg p-4 space-y-3">
        <label class="block">
          <span class="text-sm text-stone-600">Base URL</span>
          <input id="cfgBaseURL" class="mt-1 w-full px-3 py-2 border border-stone-200 rounded" placeholder="https://api.openai.com/v1" />
        </label>
        <label class="block">
          <span class="text-sm text-stone-600">API Key</span>
          <input id="cfgApiKey" type="password" class="mt-1 w-full px-3 py-2 border border-stone-200 rounded" />
        </label>
        <label class="block">
          <span class="text-sm text-stone-600">Model</span>
          <input id="cfgModel" class="mt-1 w-full px-3 py-2 border border-stone-200 rounded" placeholder="gpt-4o-mini" />
        </label>
        <div class="flex gap-2">
          <button class="btn-secondary" id="cfgTest">测试连接</button>
          <button class="btn-primary" id="cfgSave">保存</button>
          <span id="cfgTestResult" class="text-sm self-center"></span>
        </div>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
